name: http-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build
        shell: bash
        run: bash ./gradlew build --no-daemon assemble
      - name: Tests
        shell: bash
        run: bash ./gradlew :app:test --no-daemon test
